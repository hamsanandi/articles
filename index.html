<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #8b5e1a; --gold-light: #6b4510; --gold-dim: #a0783a;
  --bg: #ffffff; --section-bg: #fdf9f3; --header-bg: #f5ede0;
  --border: #d4c5a9; --border-light: #c0aa88; --text: #1a1208; --meta: #8a7055;
}
body { font-family: 'EB Garamond', serif; background: var(--bg); color: var(--text); max-width: 860px; margin: 0 auto; padding: 0 0 60px; font-size: 16px; line-height: 1.6; }

/* ── Top nav bar ── */
.site-nav { background: var(--header-bg); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; position: sticky; top: 0; z-index: 100; }
.nav-home { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--gold); text-decoration: none; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
.nav-home.kn { font-family: 'Noto Serif Kannada', serif; letter-spacing: 0.05em; text-transform: none; font-size: 0.88rem; }
.nav-home:hover { text-decoration: underline; }
.nav-links { display: flex; align-items: center; gap: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-link { font-family: 'EB Garamond', serif; font-size: 0.78rem; color: var(--meta); text-decoration: none; padding: 0 10px; line-height: 42px; white-space: nowrap; border-left: 1px solid var(--border); transition: color 0.15s, background 0.15s; }
.nav-link:first-child { border-left: none; }
.nav-link:hover { color: var(--gold); background: rgba(139,94,26,0.06); }
.nav-link.active-section { color: var(--gold); font-weight: 600; }
.nav-link.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.72rem; }

/* ── Page header ── */
.page-header { text-align: center; padding: 36px 20px 24px; border-bottom: 1px solid var(--border); position: relative; }
.page-header::after { content: ''; display: block; height: 2px; width: 120px; margin: 0 auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); }
.page-title { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; }
.page-title.kn { font-family: 'Noto Serif Kannada', serif; letter-spacing: 0.05em; text-transform: none; }
.page-subtitle { font-size: 0.95em; color: var(--gold-dim); margin-top: 6px; font-style: italic; }
.page-subtitle.kn { font-family: 'Noto Sans Kannada', sans-serif; font-style: normal; }

/* ── Lang toggle ── */
.lang-toggle { position: absolute; top: 24px; right: 24px; background: var(--header-bg); border: 1px solid var(--border-light); border-radius: 20px; padding: 5px 4px; display: flex; gap: 3px; }
.lang-btn { font-size: 0.75rem; padding: 4px 10px; border-radius: 16px; border: none; background: none; cursor: pointer; color: var(--meta); font-family: 'EB Garamond', serif; transition: all 0.18s; }
.lang-btn.active { background: var(--gold); color: #fff; font-weight: 600; }
.lang-btn.kn-btn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.78rem; }

/* ── Article list ── */
.article-list { padding: 0 20px; margin-top: 32px; }
.article-card { display: block; text-decoration: none; padding: 20px 44px 20px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--section-bg); margin-bottom: 14px; transition: background 0.15s, border-color 0.18s, transform 0.15s, box-shadow 0.15s; position: relative; }
.article-card:hover { background: var(--header-bg); border-color: var(--border-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(139,94,26,0.08); }
.article-card-title { font-family: 'EB Garamond', serif; font-size: 1.2rem; font-weight: 600; color: var(--gold-light); margin-bottom: 6px; line-height: 1.3; }
.article-card-title.kn { font-family: 'Noto Serif Kannada', serif; font-size: 1.05rem; }
.article-card-meta { font-size: 0.82em; color: var(--meta); margin-bottom: 8px; }
.article-card-meta.kn { font-family: 'Noto Sans Kannada', sans-serif; }
.article-card-desc { font-size: 0.92em; color: var(--text); line-height: 1.6; }
.article-card-desc.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.85em; }
.article-card-arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--border-light); font-size: 1.1rem; transition: color 0.18s, transform 0.18s; }
.article-card:hover .article-card-arrow { color: var(--gold); transform: translateY(-50%) translateX(3px); }

/* ── Tags & badges ── */
.tag { display: inline-block; margin-top: 8px; margin-right: 5px; padding: 2px 8px; font-size: 0.72em; border: 1px solid var(--border-light); border-radius: 4px; color: var(--meta); background: #fdf6ec; font-family: 'EB Garamond', serif; }
.lang-badge { display: inline-block; margin-top: 8px; margin-right: 6px; padding: 2px 8px; font-size: 0.7em; border-radius: 4px; font-family: 'Cinzel', serif; letter-spacing: 0.06em; vertical-align: middle; }
.lang-badge.both    { background: #e8f0e0; border: 1px solid #a8c890; color: #3a6020; }
.lang-badge.en-only { background: #e8ecf8; border: 1px solid #98a8d8; color: #2a3870; }
.lang-badge.kn-only { background: #f5e8d8; border: 1px solid #c8a878; color: #704020; font-family: 'Noto Sans Kannada', sans-serif; }

/* ── Empty state ── */
.empty { text-align: center; color: var(--meta); font-style: italic; padding: 40px 0; font-size: 0.95em; }

/* ── Divider & About ── */
.section-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 40px 20px 0; }
.about-section { max-width: 620px; margin: 28px auto 0; padding: 0 20px; line-height: 1.8; font-size: 0.95em; text-align: center; color: var(--meta); }
.about-section.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.9em; }
a { color: var(--gold-light); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Footer ── */
footer { text-align: center; color: var(--meta); margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.80em; padding-left: 20px; padding-right: 20px; }
footer.kn { font-family: 'Noto Sans Kannada', sans-serif; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .site-nav { flex-wrap: wrap; padding: 8px 12px; min-height: unset; }
  .nav-home { width: 100%; padding-bottom: 6px; line-height: 1.4; }

  .lang-toggle { position: static; margin: 12px auto 0; }
  .page-header { padding: 24px 20px 20px; }
}

     Copy one of the CASE templates from the comments above.
     Set sortDate as "YYYY-MM" so newest articles appear first.
     ─────────────────────────────────────────────────────────────── */

]; /* end ARTICLES */


/* =====================================================================
   NAV SECTIONS
   ===================================================================== */
const NAV_SECTIONS = [
  { en:"Music",             kn:"ಸಂಗೀತರಚನೆಗಳು",        url:"https://hamsanandi.github.io/compositions/" },
  { en:"Articles",          kn:"ಲೇಖನಗಳು",         url:"https://hamsanandi.github.io/articles/", current:true },
  { en:"Books",             kn:"ಪುಸ್ತಕಗಳು",       url:"https://hamsanandi.github.io/books/" },
  { en:"Metrical Poetry",   kn:"ಛಂದೋಬದ್ಧ ಕಾವ್ಯ",  url:"https://hamsanandi.github.io/poetry/" },
  { en:"Stage Productions", kn:"ರಂಗಪ್ರಯೋಗಗಳು",   url:"https://hamsanandi.github.io/stage-productions/" },
  { en:"Gamaka Vachana",    kn:"ಗಮಕ ವಾಚನ",        url:"https://hamsanandi.github.io/gamaka-vachana/" },
  { en:"Translations",      kn:"ಅನುವಾದಗಳು",       url:"https://hamsanandi.github.io/translations/" },
  { en:"Reviews",           kn:"ವಿಮರ್ಶೆಗಳು",      url:"https://hamsanandi.github.io/reviews/" }
  // { en:"Kaleidoscope", kn:"ವೈವಿಧ್ಯ", url:"https://hamsanandi.github.io/kaleidoscope/" }  ← uncomment when live
];


/* =====================================================================
   RENDERING ENGINE — no need to edit below this line
   ===================================================================== */

let lang = 'en';

function renderNav(l) {
  const s = STR[l];
  const navHome = document.getElementById('navHome');
  navHome.textContent = s.navHome;
  navHome.className   = s.navHomeClass;
  const navLinks = document.getElementById('navLinks');
  navLinks.innerHTML = '';
  NAV_SECTIONS.forEach(sec => {
    const a = document.createElement('a');
    a.href        = sec.url;
    a.textContent = sec[l];
    a.className   = 'nav-link' + (l === 'kn' ? ' kn' : '') + (sec.current ? ' active-section' : '');
    navLinks.appendChild(a);
  });
}

function langBadge(a) {
  const both = a.langs.includes('en') && a.langs.includes('kn');
  if (both)                    return '<span class="lang-badge both">EN · ಕನ್ನಡ</span>';
  if (a.langs.includes('en'))  return '<span class="lang-badge en-only">EN</span>';
  return                              '<span class="lang-badge kn-only">ಕನ್ನಡ</span>';
}

function cardHref(a, l) {
  if (a.fileEn && a.fileKn) return l === 'en' ? a.fileEn : a.fileKn;
  if (a.langs.length > 1)   return a.file + '#' + l;
  return a.file;
}

/* Sort articles newest-first using sortDate field */
function sortedArticles(articles, l) {
  return [...articles]
    .filter(a => a.langs.includes(l))
    .sort((a, b) => {
      const da = a.sortDate || '0000-00';
      const db = b.sortDate || '0000-00';
      return db.localeCompare(da);
    });
}

function render(l) {
  const s = STR[l];
  document.getElementById('htmlRoot').lang            = l === 'kn' ? 'kn' : 'en';
  document.getElementById('pageTitle').textContent    = s.pageTitle;
  document.getElementById('pageTitle').className      = s.pageTitleClass;
  document.getElementById('pageSubtitle').textContent = s.pageSubtitle;
  document.getElementById('pageSubtitle').className   = s.pageSubtitleClass;
  document.getElementById('aboutSection').innerHTML   = s.aboutText;
  document.getElementById('aboutSection').className   = s.aboutClass;
  document.getElementById('footerEl').textContent     = s.footer;
  document.getElementById('footerEl').className       = 'footer ' + (s.footerClass || '');
  document.getElementById('btnEN').classList.toggle('active', l === 'en');
  document.getElementById('btnKN').classList.toggle('active', l === 'kn');

  renderNav(l);

  const list    = document.getElementById('articleList');
  list.innerHTML = '';

  const visible = sortedArticles(ARTICLES, l);
  if (!visible.length) {
    list.innerHTML = `<p class="empty">${s.emptyMsg}</p>`;
    return;
  }

  visible.forEach(a => {
    const d    = a[l];
    const card = document.createElement('a');
    card.href      = cardHref(a, l);
    card.className = 'article-card';
    card.innerHTML = `
      <div class="${s.titleClass}">${d.title}</div>
      <div class="${s.metaClass}">${d.date} &nbsp;·&nbsp; ${d.readTime}</div>
      <div class="${s.descClass}">${d.desc}</div>
      <div>${langBadge(a)}${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <span class="article-card-arrow">→</span>
    `;
    list.appendChild(card);
  });
}

document.getElementById('langToggle').addEventListener('click', e => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  lang = btn.id === 'btnKN' ? 'kn' : 'en';
  render(lang);
});

render('en');
</script>
